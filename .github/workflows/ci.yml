# 轻量 CI：不连真机，只校验依赖可安装、语法可编译、pytest 能收集用例。
# 真机/Appium Server 请在本地或公司专用 Runner 上跑。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U pip && pip install -r requirements.txt

      - name: Byte-compile (syntax check)
        run: python -m compileall -q commons pages testcases scripts

      - name: Pytest collect-only (imports / fixtures resolvable)
        run: pytest testcases --collect-only -q
